<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/bastion-logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0086d6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bastion" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Bastion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace;z-index:99999;position:relative;">' + 
          '<h2>Fatal Error</h2>' + 
          '<pre>' + (event.error && event.error.stack ? event.error.stack : event.message) + '</pre>' + 
          '</div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace;z-index:99999;position:relative;">' + 
          '<h2>Unhandled Rejection</h2>' + 
          '<pre>' + (event.reason && event.reason.stack ? event.reason.stack : event.reason) + '</pre>' + 
          '</div>';
      });
    </script>
  </body>
</html>
